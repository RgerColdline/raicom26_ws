# 柱子检测导航配置
# 导航模式: "ego" (原有EGO路径) 或 "pcl" (PCL检测+定点飞行)
pillar_nav_mode: "pcl"

# 是否启用柱子检测和导航（PCL侧）
pillar_detect_enabled: true

# 柱子位置 (世界坐标, map系)
pillar_pos:
  p1_pos1: [-2.05, -0.80]
  p1_pos2: [-2.65, -0.80]
  p2_pos1: [-2.05, -2.05]
  p2_pos2: [-2.65, -2.05]

# 4种配置的航点序列 (相对init_pos的偏移, z使用takeoff_height)
# case_00: 柱1位1 + 柱2位1
# case_01: 柱1位2 + 柱2位2
# case_02: 柱1位1 + 柱2位2
# case_03: 柱1位2 + 柱2位1
pillar_waypoints:
  case_00:
    - [-2.75, 0.0]
    - [-2.75, -2.7]
    - [-0.45, -2.7]
  case_01:
    - [-1.95, 0.0]
    - [-1.95, -2.7]
    - [-0.45, -2.7]
  case_02:
    - [-2.75, 0.0]
    - [-2.75, -1.0]
    - [-1.45, -2.7]
  case_03:
    - [-1.95, 0.0]
    - [-1.95, -0.6]
    - [-2.80, -2.7]
    - [-0.45, -2.7]

# 柱子检测超时 (秒)，超时后使用硬编码case_00
pillar_detect_timeout: 5.0

# 航点到达判定距离 (m)
pillar_waypoint_tolerance: 0.3
