# ==================== 基础控制参数 ====================

takeoff_height: 1.1                 # 起飞高度（相对初始点，m）
takeoff_transition_z: 0.8           # 起飞过渡高度（离地，m）：爬到此高度即切入穿越赛段，边爬升边水平穿环（参考返程边飞边降），不再等爬到 takeoff_height
max_speed: 0.8                      # 定点控制最大单轴速度（m/s）
err_max: 0.25                       # 定点控制到位距离（m）
p_xy: 0.4                           # 水平位置误差 -> 速度增益
p_z: 0.8                            # 垂直位置误差 -> 速度增益

# 主控仅使用 PCL 检测 + 本地平滑轨迹；穿越参数和地图由 traverse_map.yaml 提供。

# ==================== 穿越段轨迹跟踪：速度前馈（2026-09-17） ====================
# 原来只发位置设定点（忽略 vx/vy/vz）：PX4 位置环是 P 控制，追移动目标必须靠
# 位置误差“挣”速度，稳态滞后 ≈ v/Kp ≈ 0.5m。直线上只是晚到，弯道上就变成横向
# 切内角吃掉净距（9.17 实机 case1 撞柱实测滞后 0.4~0.75m、最紧净距 0.487→0.44）。
# 现在叠加切向前馈，自然形成“段首位置主导、段中速度主导”：
#   段首：规划速度≈0 → 前馈≈0，位置环负责起步与纠偏
#   段中：前馈≈规划速度 → 不再积累滞后，速度平稳
traverse:
  ff_scale: 1.0                     # 速度前馈倍率：0=纯位置(旧行为，有滞后)；
                                    # 1.0=完全消滞后(速度最足)；0.7≈保留约 30% 滞后，更温和
                                    # 2026-09-17 实机验证 0.7 滞后约 0.25m，本次拉到 1.0 试
  ff_horizon: 0.10                  # 前馈预读时间(s)：按轨迹时间差分求切向速度的步长

# ==================== 原地旋转射击 ====================
# 投货结束后保持 wp_drop_area 不移动，只旋转机头瞄准目标。
# A/B 角度均相对起飞时记录的 init_yaw：正值逆时针，负值顺时针。
# 当前场地 A 在右、B 在左，默认 A=-90°、B=+90°；实机以激光安装方向为准微调。
shoot:
  yaw_a_offset_deg: 30.0           # 识别为 A 时的 yaw 偏移（deg）
  yaw_b_offset_deg: -30.0            # 识别为 B 时的 yaw 偏移（deg）
  yaw_kp: 1.5                       # yaw 误差 -> yaw_rate 前馈增益
  yaw_rate_max: 0.8                 # 最大 yaw_rate 指令（rad/s）
  yaw_tolerance_deg: 3.0            # 允许射击的 yaw 误差（deg）
  stable_time: 0.5                  # 位置和 yaw 连续稳定时间（s）
  duration: 1.5                     # /shoot 发出后的等待时间（s）

# ==================== 下视字母识别 ====================
down:
  min_votes: 3                      # A/B 至少达到该票数才采用识别结果

detection:
  attack_real_target: "A"           # 票数不足时的兜底目标（A 或 B）

# ==================== 固定航点（相对起飞点） ====================
wp_ring_front_x: -0.65
wp_ring_front_y: 0.0
wp_ring_front_z: 1.1
wp_ring_back_x: -2.05
wp_ring_back_y: 0.0
wp_ring_back_z: 1.1

wp_drop_area_x: -0.45
wp_drop_area_y: -2.0
wp_drop_area_z: 1.1

# ==================== 投货与降落 ====================
cargo:
  drop_angle: 0                     # <135 -> STM32 开舱
  reset_angle: 180                  # >=135 -> STM32 关舱
  drop_hover_time: 2.0              # 投货前悬停投票时间（s）

land:
  descend_speed: 0.2                # 定点下降速度（m/s）

# ==================== 下视 YOLO 节点参数 ====================
# weights_path 由 main_control.launch 设置。
yolo_down_detector:
  device: "cuda:0"
  confidence: 0.4
  imgsz: 320
  show_image: true
  image_topic: "/camera/image_raw"      # 下视 usb_cam 实际发布的话题（见 magpie360/usb_cam.sdf）
  window_name: "YOLO Down Detection"
