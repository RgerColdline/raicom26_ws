# ==================== 控制参数 ====================

takeoff_height: 1.0                 # 起飞高度（相对初始点，单位：米）
max_speed: 0.8                      # 最大水平速度（m/s）
max_yaw_rate: 0.8                   # 最大偏航角速度（rad/s）
err_max: 0.25                       # 位置误差容限（暂未使用）
hover_vert_tolerance: 0.03          # 悬停垂直稳定容差（m）
p_xy: 0.4                           # 水平位置控制 P 增益
p_z: 0.4                            # 垂直位置控制 P 增益
hover_time_needed: 3.0              # 悬停稳定所需时间（秒）
target_front_offset_x: -1.0          # 无人机要去的相对于目标靶子x方向偏移量
target_front_offset_y: 0.0          # 无人机要去的相对于目标靶子y方向偏移量
nav_goal_timeout: 60.0              # 导航到达超时时间（秒）
align_pixel_threshold: 25.0         # 像素对准误差阈值（像素）
shoot_delay: 2.0                    # 射击后等待确认时间（秒）
use_ego_planner_for_drop_area : true #导航至投放区模式选择：true=使用ego_planner路径规划，false=直接位置控制直飞

# 导航模式: "ego"=EGO-Planner路径规划  "pcl"=PCL柱子检测航点(需pcl_detection2)
pillar_nav_mode: "ego"

wait_for_vision_services: false        # 是否等待视觉服务(/switch_camera等)；false则跳过，方便单独测试PCL

# ==================== 环穿越动态参数 ====================
# 优先使用 pcl 实时检测到的环 3D 位姿计算穿越点。
# 检测失败或超时(3s)时自动回退到硬编码航点 wp_ring_front/back_。
ring_front_approach_offset: 0.8    # 环前方悬停距离 (m)
ring_back_approach_offset:  1.2    # 环后方穿越目标距离 (m)

# 环多假设追踪（类 PCL 强度机制）
ring_track:
  match_distance: 0.3           # 匹配距离阈值 (m)，以内认为是同一个环
  confidence_boost: 0.15        # 每次匹配成功置信度增量
  confidence_decay: 0.97        # 每帧衰减系数 (20Hz 运行)
  confirm_threshold: 0.7        # 锁定确认阈值，达标后位置不再更新
  min_confidence: 0.08          # 最低保留置信度，低于此值删除
  max_candidates: 3             # 最大候选数
  ema_alpha: 0.3                # EMA 平滑系数 (0~1, 越小越平滑)

# ==================== 定点射击参数（vision_laser 状态6，抛弃视觉PID） ====================
shoot:
  left_x: -0.60                  # 左射击点X（相对attack_area）
  left_y: -1.6                   # 左射击点Y
  right_x: -0.60                 # 右射击点X
  right_y: -2.6                  # 右射击点Y
  default_x: -0.60               # 默认射击点X
  default_y: -2.15               # 默认射击点Y
  left_right_threshold: 20.0     # 左右判断像素阈值（像素）
  detect_timeout: 60.0           # 目标检测超时 (s)
  stable_time: 0.5               # 射击前稳定时间 (s)

# ==================== 精准降落圆检测参数 ====================
circle_pix_vel_p: 0.001         # 圆检测像素PID P增益（纯P控制）
circle_pix_vel_max: 0.3         # 圆检测最大对准速度 (m/s)
circle_align_threshold: 30.0    # 圆对准像素阈值
circle_confirm_count: 3         # 连续确认帧数
circle_detect_timeout_s: 0.5    # 圆检测超时 (s)

# ==================== 像素PID参数 ====================
PIX_VEL_P: 0.003                    # 像素误差比例系数
PIX_VEL_I: 0.0001                   # 像素误差积分系数
PIX_VEL_D: 0.001                    # 像素误差微分系数
PIX_VEL_MAX: 0.4                    # 像素导出的最大速度指令（m/s）
PIX_INTEGRAL_MAX : 1000             # 积分限制
PIX_FAR_NORM_DIST: 150.0            # 远距离归一化阈值（像素）

# ==================== 航点坐标（相对起飞点） ====================
# 环区
wp_ring_front_x: -0.65
wp_ring_front_y: 0.0
wp_ring_front_z: 1.0               # 通常与 takeoff_height 一致
wp_ring_back_x: -2.05
wp_ring_back_y: 0.0
wp_ring_back_z: 1.0            

# 中间点
wp_come_mid_x: -1.70
wp_come_mid_y: -2.90
wp_come_mid_z: 1.2               # 通常与 takeoff_height 一致
wp_back_mid_x: -2.6
wp_back_mid_y: -2.80
wp_back_mid_z: 1.2            

# 柱子中心点（两柱之间）
wp_pillar_center_x: -2.35
wp_pillar_center_y: -1.42
wp_pillar_center_z: 1.2

# 物资投放区
wp_drop_area_x: -0.45
wp_drop_area_y: -2.0
wp_drop_area_z: 1.2

# 攻击目标识别区
wp_attack_area_x: -0.45
wp_attack_area_y: -2.0
wp_attack_area_z: 1.2

# 识别参数
detection:
  min_confidence: 0.9           # 目标检测最小置信度阈值
  drop_target_class: "drop_target"
  attack_target_class: "attack_target"
  land_target_class: "land_target"
  attack_real_target: "A" # 真实目标字母（A或B），前视时只匹配此字母，忽略干扰目标

drop:
  # 投放阶段调参
  arrive_threshold: 0.35
  detect_timeout: 10.0
  align_hold_time: 0.35
  release_max_horiz_speed: 0.12
  release_max_vert_speed: 0.06
  max_tilt: 0.08

  # 经验像素偏置：先从 0 开始，实飞后慢慢调
  camera_bias_x_px: 0.0
  camera_bias_y_px: 0.0
  release_bias_x_px: 0.0
  release_bias_y_px: 0.0

  fine_pixel_radius: 35.0
  fine_vel_scale: 0.45
  descend_distance: 0.6

land:
  kp: 0.005                   // 水平对准 P 增益
  ki: 0.0005                    // 水平对准 I 增益
  kd: 0.0001                    // 水平对准 D 增益
  max_align_speed: 0.5                    // 最大对准速度 (m/s)
  descend_speed: 0.2                    // 基础下降速度 (m/s)
  align_pixel_threshold: 15.0                   // 对准像素阈值
  fine_pixel_radius: 30.0                   // 精细调整半径
  fine_vel_scale: 0.4                   // 精细速度缩放
  final_height: 0.2                   // 最终判定高度 (m)
  final_hold_time: 1.5                    // 最终稳定保持时间 (s)